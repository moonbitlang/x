name: Package archive
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check the actual package archive
        run: |
          moon package
          mkdir "$RUNNER_TEMP/package-check"
          unzip -q _build/publish/moonbitlang-x-*.zip -d "$RUNNER_TEMP/package-check"
          cd "$RUNNER_TEMP/package-check"
          moon check --target all --deny-warn --no-mbti
          moon test --target native
